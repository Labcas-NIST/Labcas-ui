<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/labcas-ui/">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strain Timeline Mockup</title>
  <style>
    body { background: transparent; margin: 0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .wrap { padding: 8px 10px; }
    .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: #555; margin-bottom: 6px; }
    .sw { width: 12px; height: 12px; border: 2px solid #7aa35a; background: #dff0d8; display: inline-block; border-radius: 2px; margin-right: 6px; }
    .sw.normal { border-color: #888; background: #ffffff; }
    .svg { width: 100%; height: 320px; }
    .node { fill: #ffffff; stroke: #888; stroke-width: 1; rx: 6; ry: 6; }
    .node.highlight { fill: #dff0d8; stroke: #7aa35a; stroke-width: 2; }
    .label { font-size: 12px; fill: #111; dominant-baseline: middle; }
    .connector { stroke: #8c8c8c; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .arrow { marker-end: url(#arrowhead); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="legend">
      <span><span class="sw"></span>Highlighted</span>
      <span><span class="sw normal"></span>Standard</span>
    </div>
    <svg class="svg" viewBox="0 0 1240 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Strain timeline">
      <defs>
        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <polygon points="0 0, 6 3, 0 6" fill="#8c8c8c"></polygon>
        </marker>
      </defs>

      <!-- Connectors (orthogonal routing) -->
      <!-- Source fanout via shared trunk at x=320 with staggered exits -->
      <path class="connector arrow" d="M 180 128 L 320 128 L 320 38 L 360 38" />
      <path class="connector arrow" d="M 180 132 L 320 132 L 320 74 L 360 74" />
      <path class="connector arrow" d="M 180 136 L 320 136 L 320 134 L 360 134" />
      <path class="connector arrow" d="M 180 140 L 320 140 L 320 174 L 360 174" />

      <!-- 4C Storage fanout via trunk at x=640 -->
      <path class="connector arrow" d="M 500 130 L 640 130 L 640 134 L 660 134" />
      <path class="connector arrow" d="M 500 138 L 640 138 L 640 164 L 660 164" />

      <!-- Liquid culture fanout via trunk at x=640 -->
      <path class="connector arrow" d="M 500 168 L 640 168 L 640 204 L 660 204" />
      <path class="connector arrow" d="M 500 172 L 640 172 L 640 234 L 660 234" />
      <path class="connector arrow" d="M 500 176 L 640 176 L 640 264 L 660 264" />
      <path class="connector arrow" d="M 500 180 L 640 180 L 640 294 L 660 294" />

      <!-- Sequencing chain -->
      <path class="connector arrow" d="M 800 264 L 860 264" />
      <path class="connector arrow" d="M 980 264 L 1000 264" />

      <!-- Nodes -->
      <rect id="node-cfu" class="node" x="40" y="120" width="140" height="28" />
      <text class="label" x="110" y="132" text-anchor="middle">2nd Pure</text>
      <text class="label" x="110" y="146" text-anchor="middle">CFU Plate</text>

      <!-- Column 2: Primary branching -->
      <rect class="node highlight" x="360" y="24" width="140" height="28" />
      <text class="label" x="430" y="36" text-anchor="middle">Morphology</text>
      <text class="label" x="430" y="48" text-anchor="middle">Plate Image</text>

      <rect id="node-maldi-fresh" class="node" x="360" y="60" width="140" height="28" />
      <text class="label" x="430" y="74" text-anchor="middle">MALDI Spectra</text>

      <rect class="node highlight" x="360" y="120" width="140" height="28" />
      <text class="label" x="430" y="134" text-anchor="middle">4C Storage</text>

      <rect class="node highlight" x="360" y="160" width="140" height="28" />
      <text class="label" x="430" y="174" text-anchor="middle">Liquid culture</text>

      <!-- Column 3: Downstream assays (Band B only) -->
      <rect class="node" x="660" y="120" width="140" height="28" />
      <text class="label" x="730" y="132" text-anchor="middle">Morphology</text>
      <text class="label" x="730" y="146" text-anchor="middle">Plate Image</text>

      <rect class="node" x="660" y="150" width="140" height="28" />
      <text class="label" x="730" y="164" text-anchor="middle">MALDI Spectra</text>

      <rect class="node highlight" x="660" y="190" width="140" height="28" />
      <text class="label" x="730" y="204" text-anchor="middle">Gram Stain</text>

      <rect class="node" x="660" y="220" width="140" height="28" />
      <text class="label" x="730" y="232" text-anchor="middle">Cell Body/DNA</text>
      <text class="label" x="730" y="246" text-anchor="middle">Stain</text>

      <rect class="node" x="660" y="250" width="140" height="28" />
      <text class="label" x="730" y="264" text-anchor="middle">ONP Sequencing</text>

      <rect class="node highlight" x="660" y="280" width="140" height="28" />
      <text class="label" x="730" y="294" text-anchor="middle">Cryostocks</text>

      <!-- Column 4: Sequencing data products -->
      <rect class="node" x="860" y="250" width="120" height="28" />
      <text class="label" x="920" y="264" text-anchor="middle">Raw Data</text>

      <rect class="node" x="1000" y="250" width="140" height="28" />
      <text class="label" x="1070" y="264" text-anchor="middle">Assembled Data</text>
    </svg>
  </div>
  <script>
    (function () {
      var cfuNode = document.getElementById("node-cfu");
      var maldiNode = document.getElementById("node-maldi-fresh");
      if (!cfuNode || !maldiNode) {
        return;
      }

      var baseUrl = window.location.origin + "/labcas-backend/data-access-api/files/select";
      var query = 'DatasetId:"microbial_strain/strain" AND (FileName:*MALDI* OR FileName:*maldi* OR Filename:*MALDI* OR Filename:*maldi*)';
      var url = baseUrl + "?q=" + encodeURIComponent(query) + "&rows=0&wt=json";

      fetch(url, { credentials: "include" })
        .then(function (response) {
          if (!response.ok) {
            return null;
          }
          return response.json();
        })
        .then(function (data) {
          if (data && data.response && data.response.numFound > 0) {
            cfuNode.classList.add("highlight");
            maldiNode.classList.add("highlight");
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>

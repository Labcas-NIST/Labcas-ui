<html>
  <head>
    <base href="/labcas-ui/">
    <style>
      body {
        margin: 0;
        font-family: "Open Sans", Arial, sans-serif;
        color: #222;
      }

      .timeline-shell {
        padding: 6px 0 12px;
      }

      .timeline-note {
        border: 1px solid #d0d0d0;
        background: #f7f7f7;
        padding: 12px 14px;
        font-size: 13px;
      }

      .timeline-frame {
        border: none;
        width: 100%;
        height: 360px;
        box-shadow: -2px 2px 2px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="timeline-shell" id="timeline_shell">
      <div class="timeline-note">Loading timeline...</div>
    </div>
    <script>
      (function () {
        var shell = document.getElementById("timeline_shell");
        var search = "";
        try {
          search = parent && parent.window ? parent.window.location.search : "";
        } catch (e) {
          search = window.location.search;
        }

        if (search.indexOf("dataset_id=microbial_strain/strain") !== -1) {
          shell.innerHTML =
            "<iframe class='timeline-frame' src='a/strain_timeline_mockup.html' title='Strain Timeline Mockup'></iframe>";
          return;
        }

        shell.innerHTML =
          "<div class='timeline-note'>Timeline visualization is disabled in this environment.</div>";
      })();
    </script>
  </body>
</html>

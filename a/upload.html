<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var base = "";
      try {
        if (localStorage && localStorage.getItem("ui_base_path")) {
          base = localStorage.getItem("ui_base_path");
        } else if (location && location.pathname) {
          if (location.pathname == "/nist" || location.pathname.startswith("/nist/")) {
            base = "/nist";
          } else if (location.pathname == "/labcas-ui" || location.pathname.startswith("/labcas-ui/")) {
            base = "/labcas-ui";
          }
        }
      } catch (e) {}
      if (base) {
        if (base[0] != "/") {
          base = "/" + base;
        }
        if (base[base.length - 1] != "/") {
          base = base + "/";
        }
        document.write('<base href="' + base + '">');
      }
    })();
  </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to CSV Converter</title>
</head>
<body>
    <input type="file" id="jsonFileInput" accept=".json">
    <button id="downloadCsvBtn" style="display:none;">Download CSV</button>

    <script src="assets/js/labcas/jsonToCsvConverter.js"></script>
</body>
</html>

<!doctype html>
<html moznomarginboxes mozdisallowselectionprint>

<head>
  <script>
    (function() {
      var base = "";
      try {
        if (localStorage && localStorage.getItem("ui_base_path")) {
          base = localStorage.getItem("ui_base_path");
        } else if (location && location.pathname) {
          if (location.pathname == "/nist" || location.pathname.startswith("/nist/")) {
            base = "/nist";
          } else if (location.pathname == "/labcas-ui" || location.pathname.startswith("/labcas-ui/")) {
            base = "/labcas-ui";
          }
        }
      } catch (e) {}
      if (base) {
        if (base[0] != "/") {
          base = "/" + base;
        }
        if (base[base.length - 1] != "/") {
          base = base + "/";
        }
        document.write('<base href="' + base + '">');
      }
    })();
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="assets/pdftron.ico">
  <link rel="stylesheet" href="./style.css">
  <title>WebViewer UI</title>
</head>

<body>
  <div id="app"></div>
  <div id="line-connector-wrapper">
    <div id="line-connector-root"></div>
  </div>
  <script src="../core/webviewer-core.min.js"></script>
  <script src="../core/pdfjs/PDFJSDocumentType.js"></script>
  <script src="../core/pdfjs/UIConfig.js"></script>
  <script src="webviewer-ui.min.js"></script>
</body>

</html>
